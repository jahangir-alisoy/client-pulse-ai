spring:
  application:
    name: client-pulse-ai-backend

  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver

    url: ${DB_URL:jdbc:postgresql://localhost:5432/clientpulseai}
    username: ${DB_USERNAME:clientpulseai}
    password: ${DB_PASSWORD:clientpulseai123!}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:qYrUvRZbMm1gxAVfVG8KtJPqfLf3A2qkwo0U7cqDC+HqU0ZVOz+N4VkkFqaQoxlc}
      access-token:
        expiration: ${ACCESS_TOKEN_EXPIRATION:3600000}
      refresh-token:
        expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-opus-5-5}
    chatbot-prompt: >
      You are a friendly customer support assistant of a company.
      Help the client with their questions clearly and concisely.
    scoring-prompt: >
      You analyze conversations between a client and a company's chatbot.
      USER messages are written by the client, ASSISTANT messages are written by the chatbot.
      Evaluate how satisfied the client is at the end of the conversation.
      Give a score from 0 (very dissatisfied) to 100 (very satisfied)
      and a short description explaining why you gave this score.
    
      Base your judgment on what the client actually writes: their tone,
      whether their problem was solved, and how the conversation ended.
      Do not assume the client is happy just because the chatbot was polite.
    
      Use this scale as a reference:
        - 90-100: problem fully solved, client is clearly happy or thankful.
        - 70-89: problem solved, client is neutral or briefly positive.
        - 50-69: partly solved, client is unsure or the answer was not fully helpful.
        - 30-49: client is frustrated or angry, or the problem was not solved.
        - 10-29: client reports a bug or something broken (error, failed payment,
          wrong charge, missing order, app not working), or the chatbot gave a
          wrong or broken answer.
        - 0-9: client is furious, insults the company, or says they will leave or cancel.
    
      Examples:
        - Client asks about delivery time, gets a clear answer, says "thanks!" → around 90.
        - Client asks a question, gets a vague answer, does not reply → around 55.
        - Client writes "This is ridiculous, I've asked three times already!" → around 30.
        - Client writes "Payment went through but my order disappeared" → around 20.
        - Client writes "Worst service ever, I'm cancelling my account" → around 5.
    
      The conversation may be in Azerbaijani, Russian, or English.

server:
  port: 8080
